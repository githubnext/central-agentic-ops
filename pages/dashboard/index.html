<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Central Agentic Ops — Dashboard Language Renderer Preview</title>
    <meta
      name="description"
      content="Live Dashboard Language Renderer view of Central Agentic Ops data."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { renderDashboard } from "./src/presenter.js";

      const dashboardSchema = await fetch("./dashboard.json").then((response) => {
        if (!response.ok) throw new Error(`Unable to load dashboard.json: ${response.status}`);
        return response.json();
      });
      const dashboardDocument = {
        languageVersion: dashboardSchema["language-version"],
        dashboard: dashboardSchema.dashboard,
      };
      const { sources } = await fetch("./data.json").then((response) => {
        if (!response.ok) throw new Error(`Unable to load live dashboard data: ${response.status}`);
        return response.json();
      });

      document.querySelector("#root").append(renderDashboard({ document: dashboardDocument, sources }));
    </script>
  </body>
</html>

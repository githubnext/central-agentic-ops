name: Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == github.event.repository.default_branch) && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pages: write
      pull-requests: read
    steps:
      - name: Checkout trusted report source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Extract control-plane inventory
        env:
          REPORT_INVENTORY: ${{ runner.temp }}/control-plane-inventory.json
        run: node .github/scripts/pages-report/inventory.mjs

      - name: Discover deployed agentic workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_ALLOWED_REPOS: ${{ vars.CENTRAL_AGENTIC_OPS_ALLOWED_REPOS }}
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/deployed-workflows.json
        run: node .github/scripts/pages-report/deployed-workflows.mjs

      - name: Install gh-aw CLI
        uses: github/gh-aw-actions/setup-cli@b304200a0ef4b3998673bfc7945acb08ab8c88b7 # v0.87.2
        with:
          version: v0.87.2

      - name: Restore AI Credit usage cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pages-aic
          key: ${{ runner.os }}-pages-aic-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-pages-aic-${{ github.repository }}-

      - name: Collect AI Credit usage
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_AIC_CACHE: .cache/pages-aic
          REPORT_AIC_CONCURRENCY: "3"
          REPORT_AIC_USAGE: ${{ runner.temp }}/aic-usage.json
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/deployed-workflows.json
        run: node .github/scripts/pages-report/aic-usage.mjs

      - name: Save AI Credit usage cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pages-aic
          key: ${{ runner.os }}-pages-aic-${{ github.repository }}-${{ github.run_id }}

      - name: Build operations report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_ALLOWED_REPOS: ${{ vars.CENTRAL_AGENTIC_OPS_ALLOWED_REPOS }}
          REPORT_REPOSITORY_VARIABLES: ${{ toJSON(vars) }}
          REPORT_AIC_USAGE: ${{ runner.temp }}/aic-usage.json
          REPORT_INVENTORY: ${{ runner.temp }}/control-plane-inventory.json
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/deployed-workflows.json
          REPORT_OUTPUT: _site
          REPORT_VALUE_ROOT: .github/value
        run: node .github/scripts/pages-report/report.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == github.event.repository.default_branch) && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
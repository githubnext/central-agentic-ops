name: Documentation Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh activity data or use only the most recently cached snapshot.
        required: false
        type: choice
        options:
          - live
          - cache
        default: live
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - dashboard/**
      - .github/cao/**
      - .github/workflows/docs.yml
      - .github/workflows/dashboard-build.yml
      - .github/workflows/activity.yml
      - .github/workflows/cao.json
      - .github/workflows/*.lock.yml
      - .github/workflows/*.md
      - "*/aw.yml"
      - astro.config.mjs
      - aw.yml
      - docs/**
      - package.json
      - package-lock.json
      - public/**

permissions:
  actions: read
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  dashboard:
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/dashboard-build.yml
    with:
      mode: ${{ inputs.mode || 'live' }}

  build:
    needs: dashboard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Mount dashboard at /cao
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: central-agentic-ops-dashboard
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
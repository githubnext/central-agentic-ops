name: Documentation Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - astro.config.mjs
      - docs/**
      - package.json
      - package-lock.json
      - public/**

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install gh-aw
        uses: github/gh-aw-actions/setup-cli@afc709f45ed6a3f756eb4551856c6a9c42e15b2c # v0.88.0
        with:
          version: v0.88.0

      - name: Install released dashboard
        env:
          DASHBOARD_PACKAGE: ${{ runner.temp }}/cao-dashboard-package
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet "$DASHBOARD_PACKAGE"
          cd "$DASHBOARD_PACKAGE"
          gh aw add githubnext/central-agentic-ops/dashboard@v0.0.1 --no-security-scanner

      - name: Build documentation
        run: npm run docs:build

      - name: Mount dashboard at /cao
        env:
          DASHBOARD_PACKAGE: ${{ runner.temp }}/cao-dashboard-package
        run: |
          rm -rf dist/cao
          mkdir -p dist/cao
          cp -R "$DASHBOARD_PACKAGE/.github/aw/dashboard/site/." dist/cao/

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
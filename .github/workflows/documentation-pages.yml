name: Documentation Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dashboard/**
      - .github/workflows/documentation-pages.yml
      - .github/workflows/*.lock.yml
      - .github/workflows/*.md
      - "*/aw.yml"
      - astro.config.mjs
      - aw.yml
      - docs/**
      - package.json
      - package-lock.json
      - public/**
      - src/**
  workflow_run:
    workflows: ["CAO Dashboard E2E Build"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  compose:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compose.outputs.changed }}
      dashboard_hash: ${{ steps.compose.outputs.dashboard_hash }}
      documentation_hash: ${{ steps.compose.outputs.documentation_hash }}
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Leave the dashboard route to its producer
        run: rm -rf dist/cao

      - name: Resolve latest dashboard run
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          dashboard_run_id="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/cao-dashboard-build.yml/runs" \
            -f branch="$DEFAULT_BRANCH" -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$dashboard_run_id" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "A successful dashboard artifact is not yet available; leaving the current Pages deployment unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "dashboard_run_id=$dashboard_run_id" >> "$GITHUB_OUTPUT"

      - name: Download dashboard artifact
        if: steps.runs.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cao-dashboard-site
          path: ${{ runner.temp }}/cao-dashboard-site
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.runs.outputs.dashboard_run_id }}

      - name: Resolve last deployed state
        if: steps.runs.outputs.ready == 'true'
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state_run_id="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name=pages-deployment-state -f per_page=100 \
            --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')"
          echo "run_id=$state_run_id" >> "$GITHUB_OUTPUT"

      - name: Download last deployed state
        if: steps.state.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-deployment-state
          path: ${{ runner.temp }}/previous-pages-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.state.outputs.run_id }}

      - name: Compose site and detect changes
        if: steps.runs.outputs.ready == 'true'
        id: compose
        env:
          DASHBOARD_COMPONENT: ${{ runner.temp }}/cao-dashboard-site
          PREVIOUS_STATE: ${{ runner.temp }}/previous-pages-state/pages-deployment-state.json
          SITE_OUTPUT: dist
        run: |
          hash_tree() {
            local root="$1"
            (cd "$root" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) \
              | sha256sum | cut -d ' ' -f 1
          }

          documentation_hash="$(hash_tree "$SITE_OUTPUT")"
          dashboard_hash="$(hash_tree "$DASHBOARD_COMPONENT")"
          changed=true
          if [[ -f "$PREVIOUS_STATE" ]] && jq -e \
            --arg documentation "$documentation_hash" \
            --arg dashboard "$dashboard_hash" \
            '.documentation == $documentation and .dashboard == $dashboard' \
            "$PREVIOUS_STATE" >/dev/null; then
            changed=false
          fi

          rm -rf "$SITE_OUTPUT/cao"
          cp -R "$DASHBOARD_COMPONENT/cao" "$SITE_OUTPUT/cao"

          echo "documentation_hash=$documentation_hash" >> "$GITHUB_OUTPUT"
          echo "dashboard_hash=$dashboard_hash" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [[ "$changed" == "false" ]]; then
            echo "Documentation and dashboard content match the last successful deployment; skipping Pages." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Pages
        if: steps.compose.outputs.changed == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: steps.compose.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: needs.compose.outputs.changed == 'true'
    needs: compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  record-state:
    if: needs.compose.outputs.changed == 'true' && needs.deploy.result == 'success'
    needs: [compose, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record deployed component hashes
        env:
          DASHBOARD_HASH: ${{ needs.compose.outputs.dashboard_hash }}
          DOCUMENTATION_HASH: ${{ needs.compose.outputs.documentation_hash }}
        run: |
          jq -n \
            --arg documentation "$DOCUMENTATION_HASH" \
            --arg dashboard "$DASHBOARD_HASH" \
            '{schemaVersion: 1, documentation: $documentation, dashboard: $dashboard}' \
            > "$RUNNER_TEMP/pages-deployment-state.json"

      - name: Upload deployment state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-deployment-state
          path: ${{ runner.temp }}/pages-deployment-state.json
          if-no-files-found: error
          retention-days: 90

name: Documentation Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths:
      - dashboard/report/**
      - .github/central-agentic-ops.json
      - .github/scripts/control-policy/resolve.mjs
      - .github/workflows/documentation-pages.yml
      - .github/workflows/*.lock.yml
      - .github/workflows/*.md
      - "*/aw.yml"
      - astro.config.mjs
      - aw.yml
      - docs/**
      - package.json
      - package-lock.json
      - pages/dashboard/**
      - src/**

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pages: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build documentation
        run: npm run docs:build

      - name: Extract control-plane inventory
        env:
          REPORT_INVENTORY: ${{ runner.temp }}/control-plane-inventory.json
        run: node dashboard/report/inventory.mjs

      - name: Resolve authoritative control policy
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/control-policy/resolve.mjs --control .github/central-agentic-ops.json > "$RUNNER_TEMP/control-settings.json"

      - name: Discover deployed agentic workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_ALLOWED_REPOS: ${{ github.repository }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/control-settings.json
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/deployed-workflows.json
        run: node dashboard/report/deployed-workflows.mjs

      - name: Install gh-aw CLI
        uses: github/gh-aw-actions/setup-cli@b304200a0ef4b3998673bfc7945acb08ab8c88b7 # v0.87.2
        with:
          version: v0.87.2

      - name: Checkout operational-value replay runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          ref: 5cd744cc263a9d1ec5660fbf5604eaceb6f83430
          path: .cache/gh-aw-operational-value-source
          persist-credentials: false

      - name: Setup Go for operational-value replay
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .cache/gh-aw-operational-value-source/go.mod
          cache: false

      - name: Build operational-value replay runtime
        working-directory: .cache/gh-aw-operational-value-source
        run: |
          mkdir -p "$RUNNER_TEMP/gh-aw-operational-value"
          go build -ldflags "-s -w -X main.version=v0.87.6" \
            -o "$RUNNER_TEMP/gh-aw-operational-value/gh-aw" ./cmd/gh-aw
          go clean -cache -modcache

      - name: Restore operational-value observation cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pages-operational-values
          key: ${{ runner.os }}-documentation-pages-operational-values-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-documentation-pages-operational-values-${{ github.repository }}-

      - name: Restore AI Credit usage cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/documentation-pages-aic
          key: ${{ runner.os }}-documentation-pages-aic-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-documentation-pages-aic-${{ github.repository }}-

      - name: Collect AI Credit usage
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_AIC_CACHE: .cache/documentation-pages-aic
          REPORT_AIC_CONCURRENCY: "3"
          REPORT_AIC_USAGE: ${{ runner.temp }}/aic-usage.json
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/deployed-workflows.json
        run: node dashboard/report/aic-usage.mjs

      - name: Save AI Credit usage cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/documentation-pages-aic
          key: ${{ runner.os }}-documentation-pages-aic-${{ github.repository }}-${{ github.run_id }}

      - name: Collect operational-value observations
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/deployed-workflows.json
          REPORT_GH_AW_BIN: ${{ runner.temp }}/gh-aw-operational-value/gh-aw
          REPORT_OPERATIONAL_VALUES: ${{ runner.temp }}/operational-values.json
          REPORT_VALUE_CACHE: .cache/pages-operational-values/observations.json
          REPORT_VALUE_CONCURRENCY: "3"
        run: node dashboard/report/operational-values.mjs

      - name: Save operational-value observation cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pages-operational-values
          key: ${{ runner.os }}-documentation-pages-operational-values-${{ github.repository }}-${{ github.run_id }}

      - name: Build operations report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_ALLOWED_REPOS: ${{ github.repository }}
          REPORT_CONTROL_SETTINGS: ${{ runner.temp }}/control-settings.json
          REPORT_AIC_USAGE: ${{ runner.temp }}/aic-usage.json
          REPORT_INVENTORY: ${{ runner.temp }}/control-plane-inventory.json
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/deployed-workflows.json
          REPORT_OPERATIONAL_VALUES: ${{ runner.temp }}/operational-values.json
          REPORT_OUTPUT: dist/cao
        run: node dashboard/report/report.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
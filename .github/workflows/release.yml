name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare notes for review or publish an approved draft
        required: true
        type: choice
        default: prepare
        options: [prepare, publish]
      bump:
        description: Semantic version component to increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Authorize and resolve release version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Authorize request and compute version
        id: version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        with:
          script: |
            const bump = process.env.RELEASE_BUMP;
            core.info(`Processing ${context.payload.inputs.operation} release request from ${context.actor} with a ${bump} bump.`);
            if (context.payload.repository.fork) {
              throw new Error('Releases cannot run from forks');
            }

            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const role = access.role_name || access.permission;
            if (!['maintain', 'admin'].includes(role)) {
              throw new Error(`Releases require maintain or admin access; ${context.actor} has the ${role} role`);
            }
            core.info(`Authorized ${context.actor} with the ${role} role.`);

            const defaultRef = `refs/heads/${context.payload.repository.default_branch}`;
            if (context.ref !== defaultRef) {
              throw new Error(`Releases must run from ${defaultRef}, not ${context.ref}`);
            }

            const compareVersions = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] - right[index];
              }
              return 0;
            };
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const versions = tags.flatMap(({ name }) => {
              const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(name);
              return match ? [[Number(match[1]), Number(match[2]), Number(match[3])]] : [];
            });
            versions.sort((left, right) => compareVersions(right, left));
            const latest = versions[0] || [0, 0, 0];
            const next = [...latest];
            if (bump === 'major') {
              next[0] += 1;
              next[1] = 0;
              next[2] = 0;
            } else if (bump === 'minor') {
              next[1] += 1;
              next[2] = 0;
            } else {
              next[2] += 1;
            }
            const releaseTag = `v${next.join('.')}`;
            core.info(`Resolved ${bump} bump from v${latest.join('.')} to ${releaseTag}.`);
            core.setOutput('release_tag', releaseTag);

  validate-package:
    name: Validate gh-aw package
    needs: resolve-version
    if: inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install gh-aw
        uses: github/gh-aw-actions/setup-cli@23e16337f3568b3c18bb04a976793f282a016755 # v0.88.4
        with:
          version: v0.88.4
      - name: Validate files installed from aw.yml
        env:
          CENTRAL_AGENTIC_OPS_PACKAGE_SOURCE: ${{ github.repository }}@${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: npm run test:package-lifecycle

  prepare-release:
    name: Prepare draft release
    needs:
      - resolve-version
      - validate-package
    if: inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate draft release notes without assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
        with:
          script: |
            const releaseTag = process.env.RELEASE_TAG;
            core.info(`Creating draft release ${releaseTag}.`);
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: releaseTag,
              target_commitish: context.sha,
              name: releaseTag,
              draft: true,
              generate_release_notes: true,
            });
            core.summary
              .addHeading(`Prepared ${releaseTag}`)
              .addRaw('Review and edit the generated notes, then dispatch the publish operation for the same version.')
              .addEOL()
              .addLink('Review draft release', release.html_url);
            await core.summary.write();

  publish-release:
    name: Publish reviewed release
    needs: resolve-version
    if: inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish matching draft without assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
        with:
          script: |
            const releaseTag = process.env.RELEASE_TAG;
            core.info(`Looking for draft release ${releaseTag}.`);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const matchingDrafts = releases.filter((release) => (
              release.draft
              && (release.tag_name === releaseTag || release.name === releaseTag)
            ));
            if (matchingDrafts.length > 1) {
              throw new Error(`Multiple draft releases match ${releaseTag}`);
            }
            const [draft] = matchingDrafts;
            if (!draft) {
              throw new Error(`No draft release exists for ${releaseTag}`);
            }

            core.info(`Publishing draft release ${releaseTag} (release ID ${draft.id}).`);
            const { data: release } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draft.id,
              tag_name: releaseTag,
              name: releaseTag,
              draft: false,
              make_latest: 'true',
            });
            core.summary
              .addHeading(`Published ${releaseTag}`)
              .addRaw('The release contains no uploaded assets; gh aw add resolves package files from aw.yml.')
              .addEOL()
              .addLink('View release', release.html_url);
            await core.summary.write();
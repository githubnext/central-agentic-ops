name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare notes for review or publish an approved draft
        required: true
        type: choice
        default: prepare
        options: [prepare, publish]
      version:
        description: Exact semantic version without a leading v
        required: true
        type: string
        default: 0.0.1

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Validate requested version
        id: version
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const version = process.env.RELEASE_VERSION;
            const defaultRef = `refs/heads/${context.payload.repository.default_branch}`;
            if (context.ref !== defaultRef) {
              throw new Error(`Releases must run from ${defaultRef}, not ${context.ref}`);
            }
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error(`Version ${version} is not a stable semantic version`);
            }
            core.setOutput('release_tag', `v${version}`);

  validate-package:
    name: Validate gh-aw package
    needs: validate-version
    if: inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install gh-aw
        uses: github/gh-aw-actions/setup-cli@f760a0195ff9e427db7aa9e8c7b2d83a512e73cf # v0.88.3
        with:
          version: v0.88.3
      - name: Validate files installed from aw.yml
        env:
          CENTRAL_AGENTIC_OPS_PACKAGE_SOURCE: ${{ github.repository }}@${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: npm run test:package-lifecycle

  prepare-release:
    name: Prepare draft release
    needs:
      - validate-version
      - validate-package
    if: inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate draft release notes without assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.validate-version.outputs.release_tag }}
        with:
          script: |
            const releaseTag = process.env.RELEASE_TAG;
            const candidate = releaseTag.slice(1).split('.').map(Number);
            const compareVersions = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] - right[index];
              }
              return 0;
            };
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const versions = tags.flatMap(({ name }) => {
              const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(name);
              return match ? [[Number(match[1]), Number(match[2]), Number(match[3])]] : [];
            });
            versions.sort((left, right) => compareVersions(right, left));
            if (versions[0] && compareVersions(candidate, versions[0]) <= 0) {
              throw new Error(`${releaseTag} must be newer than v${versions[0].join('.')}`);
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: releaseTag,
              target_commitish: context.sha,
              name: releaseTag,
              draft: true,
              generate_release_notes: true,
            });
            core.summary
              .addHeading(`Prepared ${releaseTag}`)
              .addRaw('Review and edit the generated notes, then dispatch the publish operation for the same version.')
              .addEOL()
              .addLink('Review draft release', release.html_url);
            await core.summary.write();

  publish-release:
    name: Publish reviewed release
    needs: validate-version
    if: inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish matching draft without assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.validate-version.outputs.release_tag }}
        with:
          script: |
            const releaseTag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const matchingDrafts = releases.filter((release) => (
              release.draft
              && (release.tag_name === releaseTag || release.name === releaseTag)
            ));
            if (matchingDrafts.length > 1) {
              throw new Error(`Multiple draft releases match ${releaseTag}`);
            }
            const [draft] = matchingDrafts;
            if (!draft) {
              throw new Error(`No draft release exists for ${releaseTag}`);
            }

            const { data: release } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draft.id,
              tag_name: releaseTag,
              name: releaseTag,
              draft: false,
              make_latest: 'true',
            });
            core.summary
              .addHeading(`Published ${releaseTag}`)
              .addRaw('The release contains no uploaded assets; gh aw add resolves package files from aw.yml.')
              .addEOL()
              .addLink('View release', release.html_url);
            await core.summary.write();
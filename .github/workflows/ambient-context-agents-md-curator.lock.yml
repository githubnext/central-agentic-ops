permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ inputs.target_repo }}

run-name: Ambient context AGENTS.md · ${{ inputs.target_repo }} · ${{ inputs.safe_output_mode || 'review' }}


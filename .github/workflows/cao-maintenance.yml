name: CAO Maintenance

run-name: CAO Maintenance / ${{ inputs.command }}

on:
  workflow_dispatch:
    inputs:
      command:
        description: CAO maintenance command to run.
        required: true
        type: choice
        options:
          - clear-cache

permissions:
  actions: write

jobs:
  clear-cache:
    if: ${{ inputs.command == 'clear-cache' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clear CAO cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cache_ids="$(
            gh api --paginate "/repos/$GH_REPO/actions/caches?per_page=100" \
              --jq '.actions_caches[] | select((.key | startswith("cao-")) or (.key | contains("-cao-activity-")) or (.key | contains("-dashboard-operational-values-"))) | .id'
          )"
          count=0
          while IFS= read -r cache_id; do
            if [[ -n "$cache_id" ]]; then
              gh cache delete "$cache_id" --repo "$GH_REPO"
              count=$((count + 1))
            fi
          done <<< "$cache_ids"
          echo "Cleared $count CAO cache entries."

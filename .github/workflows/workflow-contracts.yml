name: Workflow contracts

on:
  pull_request:
    paths-ignore:
      - .github/workflows/cid.yml
      - dashboard/site/**
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/cid.yml
      - dashboard/site/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install gh-aw
        uses: github/gh-aw-actions/setup-cli@afc709f45ed6a3f756eb4551856c6a9c42e15b2c # v0.88.0
        with:
          version: v0.88.0
      - name: Run contract suite
        run: npm run check
      - name: Check patch formatting
        run: git diff --check

  package-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check package API capacity
        id: package-api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          if (( remaining < 500 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Package lifecycle incomplete::The shared GitHub App installation has $remaining core API requests remaining; 500 are required for clean-room package tests."
            echo "Package lifecycle tests were skipped because the shared GitHub App installation API quota is exhausted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install gh-aw
        if: steps.package-api.outputs.ready == 'true'
        uses: github/gh-aw-actions/setup-cli@afc709f45ed6a3f756eb4551856c6a9c42e15b2c # v0.88.0
        with:
          version: v0.88.0
      - name: Run package lifecycle integration
        if: steps.package-api.outputs.ready == 'true'
        env:
          CENTRAL_AGENTIC_OPS_PACKAGE_SOURCE: ${{ github.repository }}@${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: npm run test:package-lifecycle

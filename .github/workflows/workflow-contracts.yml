name: Workflow contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Checkout grader-capable gh-aw
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: github/gh-aw
          ref: 5cd744cc263a9d1ec5660fbf5604eaceb6f83430
          path: .cache/gh-aw
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .cache/gh-aw/go.mod
          cache-dependency-path: .cache/gh-aw/go.sum
      - name: Install grader-capable gh-aw
        working-directory: .cache/gh-aw
        run: |
          go build -ldflags "-s -w -X main.version=v0.87.6" -o gh-aw ./cmd/gh-aw
          gh extension remove aw || true
          gh extension install .
      - name: Run release gate
        env:
          CENTRAL_AGENTIC_OPS_PACKAGE_SOURCE: ${{ github.repository }}@${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: npm run check
      - name: Check patch formatting
        run: git diff --check
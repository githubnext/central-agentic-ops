name: Workflow contracts

on:
  pull_request:
    paths-ignore:
      - .github/workflows/cid.yml
      - dashboard/site/**
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/cid.yml
      - dashboard/site/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.7
      - name: Install gh-aw
        run: |
          mkdir "${RUNNER_TEMP}/gh-aw-source"
          curl --fail --location --silent --show-error https://github.com/github/gh-aw/archive/9587a1cb9f8e49b5c741815fb626508930f83537.tar.gz |
            tar -xz -C "${RUNNER_TEMP}/gh-aw-source" --strip-components=1
          mkdir -p "${HOME}/.local/share/gh/extensions/gh-aw"
          go build -C "${RUNNER_TEMP}/gh-aw-source" -ldflags "-s -w -X main.version=v0.88.0" -o "${HOME}/.local/share/gh/extensions/gh-aw/gh-aw" ./cmd/gh-aw
      - name: Run contract suite
        run: npm run check
      - name: Check patch formatting
        run: git diff --check

  package-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check package API capacity
        id: package-api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          if (( remaining < 500 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Package lifecycle incomplete::The shared GitHub App installation has $remaining core API requests remaining; 500 are required for clean-room package tests."
            echo "Package lifecycle tests were skipped because the shared GitHub App installation API quota is exhausted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.package-api.outputs.ready == 'true'
        with:
          go-version: 1.26.7
      - name: Install gh-aw
        if: steps.package-api.outputs.ready == 'true'
        run: |
          mkdir "${RUNNER_TEMP}/gh-aw-source"
          curl --fail --location --silent --show-error https://github.com/github/gh-aw/archive/9587a1cb9f8e49b5c741815fb626508930f83537.tar.gz |
            tar -xz -C "${RUNNER_TEMP}/gh-aw-source" --strip-components=1
          mkdir -p "${HOME}/.local/share/gh/extensions/gh-aw"
          go build -C "${RUNNER_TEMP}/gh-aw-source" -ldflags "-s -w -X main.version=v0.88.0" -o "${HOME}/.local/share/gh/extensions/gh-aw/gh-aw" ./cmd/gh-aw
      - name: Run package lifecycle integration
        if: steps.package-api.outputs.ready == 'true'
        env:
          CENTRAL_AGENTIC_OPS_PACKAGE_SOURCE: ${{ github.repository }}@${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output="$(npm run test:package-lifecycle 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status == 0 )); then
            exit 0
          fi
          if grep -Fq "API rate limit exceeded for installation" <<< "$output"; then
            echo "::warning title=Package lifecycle incomplete::The shared GitHub App installation API quota was exhausted during clean-room package tests."
            echo "Package lifecycle tests became inconclusive because the shared GitHub App installation API quota was exhausted during the run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

name: CAO Activity

run-name: CAO Activity / ${{ inputs.request-id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request-id:
        description: Correlation identifier supplied by a dispatching workflow.
        required: false
        type: string
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: central-agentic-ops-activity
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted activity source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Generate GitHub App token for activity
        id: activity-app-token
        env:
          GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
        if: ${{ vars.GH_AW_GITHUB_READ_APP_ID != '' && env.GH_AW_IGNORE_IF_MISSING_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_AW_GITHUB_READ_APP_ID }}
          private-key: ${{ secrets.GH_AW_GITHUB_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          github-api-url: ${{ github.api_url }}
          permission-actions: read
          permission-contents: read

      - name: Install gh-aw CLI
        uses: github/gh-aw-actions/setup-cli@23e16337f3568b3c18bb04a976793f282a016755 # v0.88.4
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
        with:
          version: v0.88.4

      - name: Restore prior activity logs for incremental refresh
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cao-activity
          key: cao-activity-logs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cao-activity-logs-

      - name: Cache recent agentic workflow logs
        env:
          GH_TOKEN: ${{ steps.activity-app-token.outputs.token || github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/cao-activity/logs"
          gh aw logs \
            --repo "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/cao-activity/logs" \
            --summary-file summary.json \
            --artifacts usage,agent,detection,graders \
            --start-date -7d \
            --cache-before -7d \
            --count 100 \
            --timeout 30 \
            --max-github-api-rate-limit -2000 \
            --max-storage 1024 \
            --json > "$RUNNER_TEMP/cao-activity/gh-aw-logs.json"

      - name: Save activity cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cao-activity
          key: cao-activity-logs-${{ github.run_id }}-${{ github.run_attempt }}

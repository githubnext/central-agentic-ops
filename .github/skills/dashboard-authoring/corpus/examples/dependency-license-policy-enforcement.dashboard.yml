language-version: "0.1.0"
dashboard:
  id: dependency-license-policy-enforcement
  title: Dependency License Policy Enforcement
  description: Run state, actionable license findings, accepted outcomes, and attainment for the dependency-license-policy-enforcement workflow.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: run-status
          title: Runs by status
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [dependency-license-policy-enforcement]
          mark: chart
          chart: bar
          encoding:
            x:
              field: run-status
              type: nominal
            y:
              field: run
              type: quantitative
              aggregate: count
        - id: actionable-findings
          title: Actionable license findings
          disclosure: essential
          data:
            source: findings
            filters:
              workflow: [dependency-license-policy-enforcement]
              finding-status: [open]
          mark: table
          controls: interactive
          empty-message: No open dependency-license findings in the selected context.
          encoding:
            columns:
              - field: finding-summary
                title: Finding
              - field: finding-severity
                title: Severity
              - field: repository
                title: Repository
              - field: finding-status
                title: Status
            href:
              field: issue-link
        - id: outcome-state
          title: Outcomes by state
          disclosure: essential
          data:
            source: outcomes
            filters:
              workflow: [dependency-license-policy-enforcement]
          mark: chart
          chart: bar
          encoding:
            x:
              field: outcome-state
              type: nominal
            y:
              field: safe-output
              type: quantitative
              aggregate: count
        - id: value-trend
          title: Operational value
          disclosure: essential
          data:
            source: operational-values
            filters:
              workflow: [dependency-license-policy-enforcement]
              operational-value-definition: [resolved-supported-license-policy-findings]
          mark: chart
          chart: line
          encoding:
            x:
              field: observed-at
              type: temporal
              time-unit: day
            y:
              field: operational-value
              type: quantitative
              aggregate: mean
            color:
              field: operational-value-definition
              type: nominal

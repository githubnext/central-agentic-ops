language-version: "0.1.0"
dashboard:
  id: stale-documentation-remediation
  title: Stale Documentation Remediation
  description: Run activity, findings, accepted outcomes, and operational-value attainment for the stale-documentation workflow.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: run-count
          title: Runs
          data:
            source: runs
            filters:
              workflow: [stale-documentation-remediation]
          mark: metric
          encoding:
            value:
              field: run
              aggregate: count
        - id: finding-status
          title: Findings by status
          data:
            source: findings
            filters:
              workflow: [stale-documentation-remediation]
          mark: chart
          chart: bar
          encoding:
            x:
              field: finding-status
              type: nominal
            y:
              field: finding
              type: quantitative
              aggregate: count
        - id: outcome-state
          title: Outcomes by state
          data:
            source: outcomes
            filters:
              workflow: [stale-documentation-remediation]
          mark: chart
          chart: bar
          encoding:
            x:
              field: outcome-state
              type: nominal
            y:
              field: safe-output
              type: quantitative
              aggregate: count
        - id: value-trend
          title: Operational value
          data:
            source: operational-values
            filters:
              workflow: [stale-documentation-remediation]
          mark: chart
          chart: line
          encoding:
            x:
              field: observed-at
              type: temporal
              time-unit: day
            y:
              field: operational-value
              type: quantitative
              aggregate: mean
            color:
              field: operational-value-definition
              type: nominal

language-version: "0.1.0"
dashboard:
  id: pull-request-size-policy-enforcement
  title: Pull Request Size Policy Enforcement
  description: Activation, findings, accepted outcomes, and attainment for the pull-request-size-policy-enforcement workflow.
  pages:
    - id: operations
      kind: custom
      title: Operations
      views:
        - id: run-count
          title: Runs
          disclosure: essential
          data:
            source: runs
            filters:
              workflow: [pull-request-size-policy-enforcement]
          mark: metric
          encoding:
            value:
              field: run
              aggregate: count
        - id: finding-status
          title: Findings by status
          disclosure: essential
          data:
            source: findings
            filters:
              workflow: [pull-request-size-policy-enforcement]
          mark: chart
          chart: bar
          encoding:
            x:
              field: finding-status
              type: nominal
            y:
              field: finding
              type: quantitative
              aggregate: count
        - id: outcome-state
          title: Outcomes by state
          disclosure: essential
          data:
            source: outcomes
            filters:
              workflow: [pull-request-size-policy-enforcement]
          mark: chart
          chart: bar
          encoding:
            x:
              field: outcome-state
              type: nominal
            y:
              field: safe-output
              type: quantitative
              aggregate: count
        - id: value-trend
          title: Operational value
          disclosure: essential
          data:
            source: operational-values
            filters:
              workflow: [pull-request-size-policy-enforcement]
              operational-value-definition: [resolved-supported-oversized-pull-request-findings]
          mark: chart
          chart: line
          encoding:
            x:
              field: observed-at
              type: temporal
              time-unit: day
            y:
              field: operational-value
              type: quantitative
              aggregate: mean
            color:
              field: operational-value-definition
              type: nominal

name: Operations Pages

on:
  workflow_dispatch:
  push:
    paths:
      - "**/aw.yml"
      - .github/skills/github-pages-report/inventory.mjs
      - .github/skills/github-pages-report/deployed-workflows.mjs
      - .github/skills/github-pages-report/report.mjs
      - .github/value/**
      - .github/workflows/*.md
      - .github/workflows/*.lock.yml
      - .github/workflows/ops-pages.yml
  schedule:
    - cron: "23 5 * * *"
  issues:
    types: [opened, edited, closed, reopened, deleted]
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, edited, closed, reopened, synchronize, converted_to_draft, ready_for_review]
  workflow_run:
    workflows:
      - Dependabot / Release Train Updater
      - Optimization / AI Credit Auditor
      - Optimization / AI Credit Optimizer
    types: [completed]

permissions:
  contents: read

concurrency:
  group: operations-pages
  cancel-in-progress: true

jobs:
  build:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == github.event.repository.default_branch) && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pages: write
      pull-requests: read
    steps:
      - name: Checkout trusted report source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Extract control-plane inventory
        env:
          REPORT_INVENTORY: ${{ runner.temp }}/control-plane-inventory.json
        run: node .github/skills/github-pages-report/inventory.mjs

      - name: Discover deployed agentic workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/deployed-workflows.json
        run: node .github/skills/github-pages-report/deployed-workflows.mjs

      - name: Build bundle report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_INVENTORY: ${{ runner.temp }}/control-plane-inventory.json
          REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/deployed-workflows.json
          REPORT_OUTPUT: _site
          REPORT_VALUE_ROOT: .github/value
        run: node .github/skills/github-pages-report/report.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == github.event.repository.default_branch) && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
name: Central Agentic Ops Activity
description: Maintain a shared, bounded index of GitHub Agentic Workflow activity.
min-version: v0.88.0
includes:
  - .github/workflows/activity.yml
resources:
  - source: actions-log.mjs
    destination: .github/aw/activity/actions-log.mjs
  - source: index.mjs
    destination: .github/aw/activity/index.mjs

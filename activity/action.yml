name: Central Agentic Ops Activity Cache
description: Restore or refresh the shared workflow activity index.

inputs:
  mode:
    description: Refresh the index or only restore the newest available cache entry.
    required: false
    default: refresh
  control-settings:
    description: Optional resolved control settings JSON.
    required: false
    default: ""
  control-policy:
    description: Checked-in CAO policy used when resolved control settings are not supplied.
    required: false
    default: .github/workflows/cao.json
  allowed-repositories:
    description: Optional comma-separated repository allowlist that may only narrow policy.
    required: false
    default: ""
  include-private:
    description: Whether private repositories may be indexed after access checks.
    required: false
    default: "false"
  run-window-hours:
    description: Bounded workflow-run history window.
    required: false
    default: "168"

outputs:
  path:
    description: Absolute path to the restored or refreshed activity index.
    value: ${{ runner.temp }}/cao-activity/deployed-workflows.json
  cache-hit:
    description: Whether an exact activity cache entry was restored.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Validate activity cache inputs
      shell: bash
      env:
        ACTIVITY_MODE: ${{ inputs.mode }}
        ACTIVITY_INCLUDE_PRIVATE: ${{ inputs.include-private }}
      run: |
        if [[ "$ACTIVITY_MODE" != "refresh" && "$ACTIVITY_MODE" != "cache" ]]; then
          echo "mode must be 'refresh' or 'cache'" >&2
          exit 1
        fi
        if [[ "$ACTIVITY_INCLUDE_PRIVATE" != "true" && "$ACTIVITY_INCLUDE_PRIVATE" != "false" ]]; then
          echo "include-private must be 'true' or 'false'" >&2
          exit 1
        fi

    - name: Restore activity cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cao-activity
        key: ${{ runner.os }}-cao-activity-v1-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-cao-activity-v1-${{ github.repository }}-

    - name: Resolve activity indexer
      if: inputs.mode == 'refresh'
      shell: bash
      run: |
        if [[ -f .github/aw/activity/index.mjs ]]; then
          echo "ACTIVITY_INDEXER=.github/aw/activity/index.mjs" >> "$GITHUB_ENV"
        elif [[ -f activity/index.mjs ]]; then
          echo "ACTIVITY_INDEXER=activity/index.mjs" >> "$GITHUB_ENV"
        else
          echo "Activity indexer is unavailable" >&2
          exit 1
        fi

    - name: Refresh activity index
      if: inputs.mode == 'refresh'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPORT_ALLOWED_REPOS: ${{ inputs.allowed-repositories }}
        REPORT_CONTROL_POLICY: ${{ inputs.control-policy }}
        REPORT_CONTROL_SETTINGS: ${{ inputs.control-settings }}
        REPORT_DEPLOYED_WORKFLOWS: ${{ runner.temp }}/cao-activity/deployed-workflows.json
        REPORT_INCLUDE_PRIVATE: ${{ inputs.include-private }}
        REPORT_RUN_WINDOW_HOURS: ${{ inputs.run-window-hours }}
      run: node "$ACTIVITY_INDEXER"

    - name: Require activity index
      shell: bash
      run: |
        if [[ ! -f "$RUNNER_TEMP/cao-activity/deployed-workflows.json" ]]; then
          echo "Cached activity index is unavailable" >&2
          exit 1
        fi

    - name: Save activity cache
      if: inputs.mode == 'refresh'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cao-activity
        key: ${{ runner.os }}-cao-activity-v1-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}

name: Central Agentic Ops
description: Central agentic workflow control plane for reusable packages at the organization level
min-version: v0.87.1
includes:
  - .github/skills/create-ops-bundle
  - .github/workflows/dependabot.md
  - .github/workflows/optimization.md
config:
  - type: require-owner-type
    value: org
  - type: repo-variable
    name: GH_AW_GITHUB_APP_ID
    prompt: GitHub App client ID (preferred authentication)
    description: Leave empty when using a PAT instead.
    optional: true
  - type: repo-secret
    name: GH_AW_GITHUB_APP_PRIVATE_KEY
    prompt: GitHub App private key (preferred authentication)
    description: Leave empty when using a PAT instead.
    optional: true
  - type: repo-secret
    name: GH_AW_GITHUB_TOKEN
    prompt: Fine-grained PAT fallback for control-plane GitHub access
    description: Optional when both GitHub App settings are configured.
    optional: true
  - type: repo-variable
    name: CENTRAL_AGENTIC_OPS_DEPENDABOT_MODE
    prompt: Dependabot rollout mode
    default: preview
    enum: [preview, review, live]
  - type: repo-variable
    name: CENTRAL_AGENTIC_OPS_DEPENDABOT_REVIEW_REPO
    prompt: Dependabot private review repository
    optional: true
  - type: repo-variable
    name: CENTRAL_AGENTIC_OPS_OPTIMIZATION_MODE
    prompt: Optimization rollout mode
    default: preview
    enum: [preview, review, live]
  - type: repo-variable
    name: CENTRAL_AGENTIC_OPS_OPTIMIZATION_REVIEW_REPO
    prompt: Optimization private review repository
    optional: true
  - type: copilot-auth
  - type: commit-and-push
    message: Add Central Agentic Ops
  - type: handoff
    message: Configure either the GitHub App pair (preferred) or GH_AW_GITHUB_TOKEN, then promote each bundle independently from preview to review or live.

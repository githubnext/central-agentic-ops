name: Central Agentic Ops
description: Central agentic workflow control plane for reusable packages at the organization level
min-version: v0.88.4
experimental: true
includes:
  - .github/workflows/aw.json
  - activity/aw.yml
  - ambient-context/aw.yml
  - aw-maintenance/aw.yml
  - dashboard/aw.yml
  - dependabot/aw.yml
  - optimization/aw.yml
resources:
  - source: AGENTS.md
    destination: .github/aw/default-AGENTS.md
  - source: default-aw.jsonl
    destination: .github/aw/default-aw.jsonl
  - source: .github/aw/instructions.md
    destination: .github/aw/instructions.md

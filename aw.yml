name: Central Agentic Ops
description: Central agentic workflow control plane for reusable packages at the organization level
min-version: v0.82.10
includes:
  - .github/workflows/dependabot.md
  - .github/workflows/optimization.md
config:
  - type: require-owner-type
    value: org
  - type: github-app
    app-id-variable: GH_AW_GITHUB_APP_ID
    private-key-secret: GH_AW_GITHUB_APP_PRIVATE_KEY
    permissions:
      actions: read
      contents: write
      issues: write
      metadata: read
      pull_requests: write
      workflows: write
  - type: repo-variable
    name: CENTRAL_AGENTIC_OPS_MODE
    prompt: Rollout mode
    default: preview
    enum: [preview, review, live]
  - type: repo-variable
    name: CENTRAL_AGENTIC_OPS_REVIEW_REPO
    prompt: Private review repository
    optional: true
  - type: copilot-auth
  - type: handoff
    message: Keep the first runs in preview before moving to review or live mode.

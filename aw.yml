name: Central Agentic Ops
description: Central agentic workflow control plane for reusable packages at the organization level
min-version: v0.88.4
experimental: true
includes:
  - .github/workflows/aw.json
  - activity/aw.yml
  - aw-doctor/aw.yml
  - dashboard/aw.yml
  - dependabot/aw.yml
  - optimization/aw.yml
resources:
  - source: AGENTS.md
    destination: .github/aw/default-AGENTS.md
  - source: .github/aw/instructions.md
    destination: .github/aw/instructions.md
  - source: dashboard/site/src/components/route-composition.js
    destination: .github/aw/dashboard/site/src/components/route-composition.js
  - source: dashboard/site/src/components/workflow-route-bodies.js
    destination: .github/aw/dashboard/site/src/components/workflow-route-bodies.js
  - source: dashboard/site/src/components/workflow-route-composition.js
    destination: .github/aw/dashboard/site/src/components/workflow-route-composition.js

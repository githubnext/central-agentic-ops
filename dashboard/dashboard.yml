name: Central Agentic Ops Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-agentic-ops-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      run-id: ${{ steps.dispatch.outputs.run-id }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Dispatch dashboard build
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_WORKFLOW: dashboard-build.yml
          DISPATCH_REF: ${{ github.ref_name }}
          DISPATCH_RUN_NAME: Central Agentic Ops Dashboard Build / dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          DISPATCH_INPUTS: '{"site-path":".","request-id":"dashboard-${{ github.run_id }}-${{ github.run_attempt }}"}'
        run: node .github/aw/dashboard/dispatch-workflow.mjs

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false

      - name: Download dashboard artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: central-agentic-ops-dashboard
          path: _site
          github-token: ${{ github.token }}
          run-id: ${{ needs.build.outputs.run-id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
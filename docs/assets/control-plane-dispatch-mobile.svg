<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 886" role="img" aria-labelledby="title description">
  <title id="title">Central control plane pipeline</title>
  <desc id="description">A central control plane dispatches Supply chain, Compliance, Security, and Governance operation packages downward through every organization to every repo, then correlates the outcomes into an operational report excerpt.</desc>
  <defs>
    <style>
      :root { --surface:#fff; --foreground:#1f2328; --muted:#656d76; --border:#d0d7de; --connector:#afb8c1; --success:#1f883d; --danger:#cf222e; --attention:#bf8700; --accent:#8250df; --info:#0969da; --shadow:#1f2328; }
      [fill="#ffffff"]{fill:var(--surface)} [fill="#1f2328"]{fill:var(--foreground)} [fill="#656d76"]{fill:var(--muted)}
      [fill="#1f883d"]{fill:var(--success)} [fill="#cf222e"]{fill:var(--danger)} [fill="#bf8700"]{fill:var(--attention)} [fill="#8250df"]{fill:var(--accent)} [fill="#0969da"]{fill:var(--info)}
      [stroke="#ffffff"]{stroke:var(--surface)} [stroke="#d0d7de"]{stroke:var(--border)} [stroke="#afb8c1"]{stroke:var(--connector)} [stroke="#8250df"]{stroke:var(--accent)}
      [stroke="#1f883d"]{stroke:var(--success)} [stroke="#cf222e"]{stroke:var(--danger)} [stroke="#bf8700"]{stroke:var(--attention)} [stroke="#0969da"]{stroke:var(--info)}
      .dispatch-flow{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-dasharray:.012 .988;stroke-dashoffset:1;filter:url(#flow-glow);animation:dispatch-flow 3.6s linear infinite}
      .dispatch-flow:nth-child(2){animation-delay:-1.2s}.dispatch-flow:nth-child(3){animation-delay:-2.4s}
      .package-status{animation:package-status 5s ease-in-out infinite}
      .report-update{animation:report-update 5s steps(1,end) infinite}
      .report-chart{stroke-dasharray:1;stroke-dashoffset:1;animation:report-chart 5s ease-out infinite}
      @keyframes dispatch-flow{0%{stroke-dashoffset:1;opacity:0}8%{opacity:1}82%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
      @keyframes package-status{0%,12%,100%{fill:var(--surface);stroke:var(--muted)}20%,68%{fill:var(--attention);stroke:var(--surface)}76%,92%{fill:var(--success);stroke:var(--surface)}}
      @keyframes report-update{0%,74%{opacity:0}75%,92%{opacity:1}93%,100%{opacity:0}}
      @keyframes report-chart{0%,74%{stroke-dashoffset:1}88%,100%{stroke-dashoffset:0}}
      @media(prefers-reduced-motion:reduce){.dispatch-flow{display:none}.package-status{animation:none}.report-update{display:none}.report-chart{animation:none}}
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d0d7de" stroke-width=".6"/></pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--shadow)" flood-opacity=".16"/></filter>
    <filter id="flow-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="390" height="886" fill="url(#grid)" opacity=".14"/>

  <g fill="none" stroke="#d0d7de" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".16">
    <path d="M57 128V180M147 128V180M237 128V180M327 128V180M57 180H327M75 180V216M195 180V216M315 180V216"/>
    <path d="M75 272V320M195 272V320M315 272V320M55 320H335M130 320V376M260 320V376M55 320V476H80M335 320V476H310"/>
    <path d="M80 404H40V530H195M310 404H350V530H195M130 504V554H195M260 504V554H195M195 530V590"/>
  </g>
  <g fill="none" stroke="#afb8c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M57 128V180M147 128V180M237 128V180M327 128V180M57 180H327M75 180V216M195 180V216M315 180V216"/>
    <path d="M75 272V320M195 272V320M315 272V320M55 320H335M130 320V376M260 320V376M55 320V476H80M335 320V476H310"/>
    <path d="M80 404H40V530H195M310 404H350V530H195M130 504V554H195M260 504V554H195M195 530V590"/>
  </g>
  <g aria-hidden="true">
    <path class="dispatch-flow" pathLength="1" d="M57 128V180M147 128V180M237 128V180M327 128V180M57 180H327M75 180V216M195 180V216M315 180V216"/>
    <path class="dispatch-flow" pathLength="1" d="M75 272V320M195 272V320M315 272V320M55 320H335M130 320V376M260 320V376M55 320V476H80M335 320V476H310"/>
    <path class="dispatch-flow" pathLength="1" d="M80 404H40V530H195M310 404H350V530H195M130 504V554H195M260 504V554H195M195 530V590"/>
  </g>


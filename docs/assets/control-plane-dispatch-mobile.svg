    <rect x="195" y="32" width="84" height="64" rx="6" fill="#8250df" fill-opacity=".12" stroke="#d0d7de"/>
    <text x="237" y="68" fill="var(--foreground)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600">Security</text>
    <rect x="285" y="32" width="84" height="64" rx="6" fill="#bf8700" fill-opacity=".12" stroke="#d0d7de"/>
    <text x="327" y="68" fill="var(--foreground)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600">Governance</text>

    <rect x="25" y="216" width="100" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="75" y="249" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600">Org A</text>

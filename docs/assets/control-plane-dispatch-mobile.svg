    <g fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600"><text x="130" y="409">Repo 1</text><text x="260" y="409">Repo 2</text><text x="130" y="481">Repo 3</text><text x="260" y="481">Repo 4</text></g>
    <g fill="#656d76"><circle cx="187" cy="526" r="2"/><circle cx="195" cy="526" r="2"/><circle cx="203" cy="526" r="2"/></g>


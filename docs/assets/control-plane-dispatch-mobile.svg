      <text x="16" y="142" fill="#656d76" font-size="8" font-weight="700">VALUE OVER TIME</text><g fill="none" stroke="#d0d7de" stroke-width=".7" opacity=".7"><path d="M16 166H258M16 190H258M16 214H258M16 238H258"/><path d="M76 158V244M137 158V244M198 158V244"/></g>

    <text x="57" y="60" fill="var(--foreground)" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" font-weight="600"><tspan x="57">Supply</tspan><tspan x="57" dy="15">chain</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description" data-visual-kind="diagram" data-visual-id="authentication-selection">
  <title id="title">Central Agentic Ops authentication selection</title>
  <desc id="description">A decision flow selects the least-powerful credential. Use the built-in GitHub token when it satisfies bounded self-review or public-only review. Otherwise use separate read-only and write-capable GitHub Apps when they can be installed for every required organization. If Apps are unavailable, use an eligible fine-grained personal access token only after explaining tradeoffs and obtaining consent. If no credential is eligible, stop and narrow or split the scope, or request owner help.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1184" height="584" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="52" y="50" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">CHOOSE THE LEAST-POWERFUL ELIGIBLE CREDENTIAL</text>
  <text x="52" y="80" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Evaluate scope, installation coverage, API requirements, and consent in order.</text>

  <path d="M360 271H444" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M756 271H840" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M204 340V408" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 340V408" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M996 202V150" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M996 340V408" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="402" y="258" fill="#c9d1d9" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">NO</text>
  <text x="798" y="258" fill="#c9d1d9" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">NO</text>
  <text x="224" y="382" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">YES</text>
  <text x="620" y="382" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">YES</text>
  <text x="1016" y="177" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">YES</text>
  <text x="1016" y="382" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">NO</text>

  <g data-node="bounded-token-check">
    <rect x="48" y="202" width="312" height="138" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="72" y="236" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">CHECK 1</text>
    <text x="72" y="272" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">Can GITHUB_TOKEN satisfy</text>
    <text x="72" y="300" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">this bounded self-review</text>
    <text x="72" y="328" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">or public-only review?</text>
  </g>

  <g data-node="app-installation-check">
    <rect x="444" y="202" width="312" height="138" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="468" y="236" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">CHECK 2</text>
    <text x="468" y="272" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">Can GitHub Apps be installed</text>
    <text x="468" y="300" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">for every required</text>
    <text x="468" y="328" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">organization?</text>
  </g>

  <g data-node="pat-eligibility-check">
    <rect x="840" y="202" width="312" height="138" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="864" y="236" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">CHECK 3</text>
    <text x="864" y="272" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">Is one fine-grained PAT</text>
    <text x="864" y="300" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">eligible for the exact</text>
    <text x="864" y="328" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">scope and APIs?</text>
  </g>

  <g data-node="github-token-outcome">
    <rect x="48" y="410" width="312" height="126" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
    <text x="72" y="445" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">USE BUILT-IN TOKEN</text>
    <text x="72" y="484" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="800">GITHUB_TOKEN</text>
    <text x="72" y="515" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Keep the run within its bounds.</text>
  </g>

  <g data-node="github-app-outcome">
    <rect x="444" y="410" width="312" height="126" rx="8" fill="#161b22" stroke="#39c5cf" stroke-width="3"/>
    <text x="468" y="445" fill="#56d4dd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">USE GITHUB APPS</text>
    <text x="468" y="482" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="800">Separate read-only and</text>
    <text x="468" y="510" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="800">write-capable Apps</text>
  </g>

  <g data-node="pat-outcome">
    <rect x="840" y="92" width="312" height="58" rx="8" fill="#161b22" stroke="#d29922" stroke-width="3"/>
    <text x="864" y="127" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Explain tradeoffs, obtain consent, configure PAT</text>
  </g>

  <g data-node="stop-outcome">
    <rect x="840" y="410" width="312" height="126" rx="8" fill="#161b22" stroke="#f85149" stroke-width="3"/>
    <text x="864" y="445" fill="#ff7b72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">STOP</text>
    <text x="864" y="480" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Narrow or split the scope,</text>
    <text x="864" y="508" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">or request owner help.</text>
  </g>
</svg>
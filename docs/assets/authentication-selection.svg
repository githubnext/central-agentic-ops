<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title description" data-visual-kind="diagram" data-visual-id="authentication-selection">
  <title id="title">Central Agentic Ops authentication selection</title>
  <desc id="description">A left-to-right decision flow selects the least-powerful eligible credential. No continues to the next check. Yes selects the outcome below each check. Use the built-in GitHub token for bounded self-review or public-only review. Otherwise use separate read-only and write-capable GitHub Apps when they can be installed for every required organization. If Apps are unavailable, use an eligible fine-grained personal access token only after explaining tradeoffs and obtaining consent. If no credential is eligible, stop and narrow or split the scope, or request owner help.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="1184" height="624" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="48" y="50" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">AUTHENTICATION DECISION</text>
  <text x="48" y="82" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Start with the built-in token. Broaden credentials only when the previous option cannot satisfy the run.</text>

  <path d="M290 280H340" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M590 280H640" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M890 280H940" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M165 370V438" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M465 370V438" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M765 370V438" fill="none" stroke="#8c959f" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="315" y="266" fill="#c9d1d9" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">NO</text>
  <text x="615" y="266" fill="#c9d1d9" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">NO</text>
  <text x="915" y="266" fill="#c9d1d9" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">NO</text>
  <text x="184" y="409" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">YES</text>
  <text x="484" y="409" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">YES</text>
  <text x="784" y="409" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">YES</text>

  <g data-node="bounded-token-check">
    <rect x="40" y="190" width="250" height="180" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="64" y="225" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">CHECK 1</text>
    <text x="64" y="265" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">Can GITHUB_TOKEN</text>
    <text x="64" y="294" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">satisfy this bounded</text>
    <text x="64" y="323" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">self-review or</text>
    <text x="64" y="352" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">public-only review?</text>
  </g>

  <g data-node="app-installation-check">
    <rect x="340" y="190" width="250" height="180" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="364" y="225" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">CHECK 2</text>
    <text x="364" y="265" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">Can GitHub Apps be</text>
    <text x="364" y="294" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">installed for every</text>
    <text x="364" y="323" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">required organization?</text>
  </g>

  <g data-node="pat-eligibility-check">
    <rect x="640" y="190" width="250" height="180" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="664" y="225" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">CHECK 3</text>
    <text x="664" y="265" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">Is one fine-grained</text>
    <text x="664" y="294" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">PAT eligible for the</text>
    <text x="664" y="323" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700">exact scope and APIs?</text>
  </g>

  <g data-node="stop-outcome">
    <rect x="940" y="215" width="220" height="130" rx="8" fill="#161b22" stroke="#f85149" stroke-width="3"/>
    <text x="964" y="250" fill="#ff7b72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">STOP</text>
    <text x="964" y="284" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Narrow or split scope,</text>
    <text x="964" y="312" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">or request owner help.</text>
  </g>

  <g data-node="github-token-outcome">
    <rect x="40" y="440" width="250" height="142" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
    <text x="64" y="476" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">USE BUILT-IN TOKEN</text>
    <text x="64" y="518" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="800">GITHUB_TOKEN</text>
    <text x="64" y="552" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Keep the run bounded.</text>
  </g>

  <g data-node="github-app-outcome">
    <rect x="340" y="440" width="250" height="142" rx="8" fill="#161b22" stroke="#39c5cf" stroke-width="3"/>
    <text x="364" y="476" fill="#56d4dd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">USE GITHUB APPS</text>
    <text x="364" y="516" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="800">Separate read-only</text>
    <text x="364" y="545" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="800">and write-capable Apps</text>
  </g>

  <g data-node="pat-outcome">
    <rect x="640" y="440" width="250" height="142" rx="8" fill="#161b22" stroke="#d29922" stroke-width="3"/>
    <text x="664" y="476" fill="#e3b341" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">USE PAT FALLBACK</text>
    <text x="664" y="516" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Explain tradeoffs.</text>
    <text x="664" y="544" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Obtain consent.</text>
    <text x="664" y="572" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Configure eligible PAT.</text>
  </g>
</svg>
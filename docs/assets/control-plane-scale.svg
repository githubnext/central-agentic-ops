<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">Central Agentic Ops control plane at enterprise scale</title>
  <desc id="description">One central control plane applies policy and identity, promotes work through staged, review, and live gates, and dispatches bounded workflows across organizations and thousands of repositories.</desc>

  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="780" height="780" rx="40" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="10" y="10" width="780" height="780" rx="40" fill="url(#grid)"/>

  <text x="64" y="72" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">ORCHESTRATE</text>
  <text x="339" y="72" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">PROMOTE</text>
  <text x="591" y="72" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">SCALE</text>

  <path d="M302 298H356M444 180H508M444 298H508M444 416H508" fill="none" stroke="#a371f7" stroke-width="3" stroke-linecap="round"/>
  <path d="M508 180V416" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M508 180H548M508 298H548M508 416H548" fill="none" stroke="#39c5cf" stroke-width="3" stroke-linecap="round"/>

  <rect x="58" y="132" width="244" height="332" rx="28" fill="#161b22" stroke="#8957e5" stroke-width="3"/>
  <circle cx="180" cy="247" r="74" fill="#0d1117" stroke="#a371f7" stroke-width="4" filter="url(#glow)"/>
  <path d="M180 194L224 211V246C224 279 205 304 180 315C155 304 136 279 136 246V211L180 194Z" fill="#6e40c9" stroke="#d2a8ff" stroke-width="3"/>
  <path d="M157 246L173 262L205 228" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="353" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="800">CONTROL PLANE</text>
  <text x="180" y="386" fill="#d2a8ff" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">identity • policy • budgets</text>
  <text x="180" y="416" fill="#8b949e" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">selection • provenance</text>

  <rect x="338" y="142" width="116" height="76" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="361" cy="168" r="7" fill="#58a6ff"/>
  <text x="382" y="175" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">STAGED</text>
  <text x="396" y="198" fill="#8b949e" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">prove, no writes</text>

  <rect x="338" y="260" width="116" height="76" rx="18" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <circle cx="361" cy="286" r="7" fill="#d29922"/>
  <text x="382" y="293" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">REVIEW</text>
  <text x="396" y="316" fill="#8b949e" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">inspect privately</text>

  <rect x="338" y="378" width="116" height="76" rx="18" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="361" cy="404" r="7" fill="#3fb950"/>
  <text x="382" y="411" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">LIVE</text>
  <text x="396" y="434" fill="#8b949e" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">bounded writes</text>

  <g>

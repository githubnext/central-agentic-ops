      <rect x="624" y="172" width="42" height="38" rx="8"/>
      <rect x="678" y="172" width="42" height="38" rx="8"/>
    </g>
    <g fill="#58a6ff">
      <circle cx="591" cy="191" r="5"/><circle cx="645" cy="191" r="5"/><circle cx="699" cy="191" r="5"/>
    </g>
  </g>

  <g>
    <rect x="548" y="256" width="194" height="116" rx="20" fill="#161b22" stroke="#39c5cf" stroke-width="2"/>
    <text x="570" y="287" fill="#39c5cf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">ORG BETA</text>
    <g fill="#0d1117" stroke="#8b949e" stroke-width="2">
      <rect x="570" y="306" width="42" height="38" rx="8"/>
      <rect x="624" y="306" width="42" height="38" rx="8"/>
      <rect x="678" y="306" width="42" height="38" rx="8"/>
    </g>
    <g fill="#a371f7">
      <circle cx="591" cy="325" r="5"/><circle cx="645" cy="325" r="5"/><circle cx="699" cy="325" r="5"/>
    </g>
  </g>

  <g>
    <rect x="548" y="390" width="194" height="116" rx="20" fill="#161b22" stroke="#39c5cf" stroke-width="2"/>
    <text x="570" y="421" fill="#39c5cf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">ORG N</text>
    <g fill="#0d1117" stroke="#8b949e" stroke-width="2">
      <rect x="570" y="440" width="42" height="38" rx="8"/>
      <rect x="624" y="440" width="42" height="38" rx="8"/>
      <rect x="678" y="440" width="42" height="38" rx="8"/>
    </g>
    <g fill="#3fb950">
      <circle cx="591" cy="459" r="5"/><circle cx="645" cy="459" r="5"/><circle cx="699" cy="459" r="5"/>
    </g>
  </g>

  <path d="M104 550H696" stroke="#30363d" stroke-width="2"/>
  <text x="400" y="620" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="54" font-weight="900">100,000 REPOS</text>
  <text x="400" y="660" fill="#39c5cf" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">one policy envelope • every run traceable</text>

  <g transform="translate(172 706)">
    <circle cx="0" cy="0" r="7" fill="#58a6ff"/>
    <text x="18" y="6" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">STAGE</text>
    <circle cx="134" cy="0" r="7" fill="#d29922"/>
    <text x="152" y="6" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">REVIEW</text>
    <circle cx="286" cy="0" r="7" fill="#3fb950"/>
    <text x="304" y="6" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">PROMOTE</text>
  </g>
</svg>
    <rect x="630" y="150" width="100" height="80" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="680" y="184" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600">Org A</text><text x="680" y="207" fill="#656d76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">route</text>
    <rect x="630" y="330" width="100" height="80" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="680" y="364" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="600">Org B</text><text x="680" y="387" fill="#656d76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">route</text>


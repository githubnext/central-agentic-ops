<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title description">
  <title id="title">Central control plane pipeline</title>
  <desc id="description">A central control plane dispatches an extensible set of bounded workflow packages, including Dependabot and Optimization, through organizations to up to ten thousand repositories, then consolidates ten successful and two failed outcomes.</desc>
  <defs>
    <style>
      :root { --surface:#fff; --foreground:#1f2328; --muted:#656d76; --border:#d0d7de; --connector:#afb8c1; --success:#1f883d; --danger:#cf222e; --attention:#bf8700; --accent:#8250df; --shadow:#1f2328; }
      [fill="#ffffff"]{fill:var(--surface)} [fill="#1f2328"]{fill:var(--foreground)} [fill="#656d76"]{fill:var(--muted)}
      [fill="#1f883d"]{fill:var(--success)} [fill="#cf222e"]{fill:var(--danger)} [fill="#bf8700"]{fill:var(--attention)} [fill="#8250df"]{fill:var(--accent)}
      [stroke="#ffffff"]{stroke:var(--surface)} [stroke="#d0d7de"]{stroke:var(--border)} [stroke="#afb8c1"]{stroke:var(--connector)} [stroke="#8250df"]{stroke:var(--accent)}
      [stroke="#1f883d"]{stroke:var(--success)} [stroke="#cf222e"]{stroke:var(--danger)} [stroke="#bf8700"]{stroke:var(--attention)}
      @media(prefers-color-scheme:dark){:root{--surface:#161b22;--foreground:#f0f6fc;--muted:#8b949e;--border:#30363d;--connector:#484f58;--success:#3fb950;--danger:#f85149;--attention:#d29922;--accent:#a371f7;--shadow:#010409}}
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d0d7de" stroke-width=".6"/></pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="var(--shadow)" flood-opacity=".16"/></filter>
  </defs>

  <rect width="1100" height="560" fill="url(#grid)" opacity=".14"/>

  <g fill="none" stroke="#d0d7de" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".16">
    <path d="M180 416V280H400M400 190V370M400 190H420M400 370H420"/>
    <path d="M580 190H630M580 370H630"/>
    <path d="M730 190H750V150H780M750 190V230H780"/>
    <path d="M730 370H750V330H780M750 370V410H780"/>
    <path d="M900 150H920V460H260M900 230H920M900 330H920M900 410H920"/>
